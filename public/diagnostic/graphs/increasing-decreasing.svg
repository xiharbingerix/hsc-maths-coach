  <g stroke="#e2e8f0" stroke-width="1">
    <path d="M80 40V300"/>
    <path d="M140 40V300"/>
    <path d="M200 40V300"/>
    <path d="M260 40V300"/>
    <path d="M320 40V300"/>
    <path d="M380 40V300"/>
    <path d="M440 40V300"/>
    <path d="M500 40V300"/>
    <path d="M560 40V300"/>
    <path d="M80 280H560"/>
    <path d="M80 220H560"/>
    <path d="M80 160H560"/>
    <path d="M80 100H560"/>
    <path d="M80 40H560"/>
  </g>
  <g stroke="#0f172a" stroke-width="2">
